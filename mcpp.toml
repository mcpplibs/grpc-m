    "third_party/grpc-1.83.0/src/cpp/server/xds_server_credentials.cc",
    "third_party/grpc-1.83.0/src/cpp/thread_manager/thread_manager.cc",
    "third_party/grpc-1.83.0/src/cpp/util/byte_buffer_cc.cc",
    "third_party/grpc-1.83.0/src/cpp/util/status.cc",
    "third_party/grpc-1.83.0/src/cpp/util/string_ref.cc",
    "third_party/grpc-1.83.0/src/cpp/util/time_cc.cc",
    "third_party/grpc-1.83.0/third_party/address_sorting/address_sorting.c",
    "third_party/grpc-1.83.0/third_party/address_sorting/address_sorting_posix.c",
    "third_party/grpc-1.83.0/third_party/address_sorting/address_sorting_windows.c",
]


# PUBLIC surface: what a consumer needs for <grpcpp/grpcpp.h> and <grpc/grpc.h>.
# Everything else grpc's own TUs need is private and emitted by build.mcpp.
include_dirs = ["third_party/grpc-1.83.0/include"]

c_standard = "c11"

# Vendored upstream source is not ours to fix, and gRPC compiles clean only
# under its own CMake warning set — without this, every build is buried in
# -Wreturn-type / -Wattributes noise from third_party/**, which would drown out
# a real diagnostic. compat.ffmpeg and opencv-m carry -w for the same reason.
#
# Scoped to the vendored tree rather than set globally, so src/grpc.cppm — the
# code this repository actually owns — keeps its warnings. NOTE the position:
# [[build.flags]] opens a new table, so every plain [build] key must precede it.
[[build.flags]]
glob     = "third_party/**"
cxxflags = ["-w"]
cflags   = ["-w"]

[targets.grpc]
kind = "lib"

# ─────────────────────────────────────────────────────────────────────────────
# Dependencies — all from mcpp-index, none re-vendored.
#
# protobuf carries `upb` because gRPC's generated src/core/ext/upb-gen/**.c is
# upb code and links against that runtime. Note gRPC ships its own copy of
# google/protobuf/descriptor.upb_minitable.c, byte-for-byte identical to the
# bootstrap copy the upb feature compiles — the source list above excludes
# gRPC's, since building both is a duplicate-symbol failure.
#
# OpenSSL rather than BoringSSL: gRPC supports it as a first-class provider and
# only 9 files in src/core carry an OPENSSL_IS_BORINGSSL branch, with the
# OpenSSL side being the default path.
# ─────────────────────────────────────────────────────────────────────────────
[dependencies]
compat.abseil   = "20250512.1"
compat.protobuf = { version = "35.1", features = ["upb"] }
compat.re2      = "2022-04-01"
compat.openssl  = "3.5.1"
# gRPC's own message compression (src/core/lib/compression/message_compress.cc
# calls deflate/inflate directly), NOT protobuf's optional gzip streams — this
# is why the dependency is here rather than compat.protobuf's `gzip` feature.
compat.zlib     = "1.3.2"

[features]
# c-ares is ON by default, matching upstream gRPC and every distro build of it.
# Turn it off with `default-features = false`, which drops the 7 resolver TUs
# and the c-ares dependency and defines GRPC_ARES=0 (upstream's own
# `grpc_no_ares=true`); gRPC then uses its native DNS resolver.
#
# The direction matters: mcpp features are ADDITIVE, so the off-state cannot be
# a feature. -DGRPC_ARES=0 in the base flags could never be retracted by a
# feature turning it back to 1 — both would land on the command line. The
# off-switch therefore lives in build.mcpp, which emits GRPC_ARES=0 only when
# `ares` is absent (include/grpc/support/port_platform.h defaults it to 1 under
# #ifndef, so saying nothing is the on-state).
default = ["ares"]

[features.ares]
# The c-ares-backed resolver TUs. A feature CAN carry sources, so the ON state
# is fully declarative; only the OFF state needs build.mcpp (see there).
sources = [
    "third_party/grpc-1.83.0/src/core/lib/event_engine/ares_resolver.cc",
    "third_party/grpc-1.83.0/src/core/resolver/dns/c_ares/dns_resolver_ares.cc",
    "third_party/grpc-1.83.0/src/core/resolver/dns/c_ares/grpc_ares_ev_driver_posix.cc",
    "third_party/grpc-1.83.0/src/core/resolver/dns/c_ares/grpc_ares_ev_driver_windows.cc",
    "third_party/grpc-1.83.0/src/core/resolver/dns/c_ares/grpc_ares_wrapper.cc",
    "third_party/grpc-1.83.0/src/core/resolver/dns/c_ares/grpc_ares_wrapper_posix.cc",
    "third_party/grpc-1.83.0/src/core/resolver/dns/c_ares/grpc_ares_wrapper_windows.cc",
]

[feature-deps.ares]
compat.c-ares = "1.34.5"

[target.'cfg(windows)'.build]
cxxflags = [
    # Upstream's own MSVC set (CMakeLists.txt add_definitions under if(MSVC)).
    "-D_WIN32_WINNT=0x600",
    "-D_SCL_SECURE_NO_WARNINGS",
    "-D_CRT_SECURE_NO_WARNINGS",
    "-D_WINSOCK_DEPRECATED_NO_WARNINGS",
    # Not upstream's, but required here for the same reason compat.abseil and
    # compat.re2 need it: <windows.h> defines min/max as function-like macros,
    # and gRPC uses std::min/std::max throughout. A CMake consumer normally has
    # NOMINMAX set project-wide; each package owns its flags here.
    "-DNOMINMAX",
]
cflags = ["-D_WIN32_WINNT=0x600", "-DNOMINMAX"]
ldflags = ["-lws2_32", "-lcrypt32", "-liphlpapi"]

[target.'cfg(linux)'.build]
ldflags = ["-lpthread", "-ldl", "-lm"]

[target.'cfg(macos)'.build]
ldflags = ["-lresolv"]

