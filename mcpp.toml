[package]
name        = "grpc"
version     = "1.83.0"
standard    = "c++23"
description = "gRPC 1.83.0 for mcpp — upstream C++ source vendored and built by this manifest, with abseil / protobuf / re2 / c-ares / OpenSSL taken from mcpp-index instead of re-vendored."
license     = "Apache-2.0"
repo        = "https://github.com/mcpplibs/grpc-m"

# linux + macOS only, and the reason is a dependency rather than gRPC itself:
# compat.openssl has no windows xpm entry ("windows deferred — requires prebuilt
# MSVC libs"), so resolution fails there with
#   E_NOT_FOUND: package 'compat:openssl@3.5.1' not found
# before a single TU is compiled. gRPC's secure build cannot drop TLS, so this
# package's platform coverage is exactly compat.openssl's. The
# [target.'cfg(windows)'] flags below are kept and correct — they are what this
# package will need the day that entry lands.
platforms   = ["linux", "macos"]

# ─────────────────────────────────────────────────────────────────────────────
# Single-repo build, the shape opencv-m established.
#
#   third_party/grpc-1.83.0/   pinned upstream source, ZERO patches — a pruned
#                              import of tag v1.83.0 (src/, include/ and the two
#                              third_party pieces gRPC actually vendors itself)
#   tools/gen_sources.py       regenerates the source arrays below from
#                              upstream's CMakeLists.txt; `--check` proves the
#                              manifest and the vendored tree have not drifted
#   build.mcpp                 the private include dirs + the `ares` OFF state,
#                              i.e. only what this grammar cannot express
#
# Why a repo at all, rather than a compat descriptor in mcpp-index: gRPC
# publishes NO self-contained source artifact. Its tag archive carries
# abseil / protobuf / re2 / boringssl / zlib as EMPTY submodule placeholders, so
# there is nothing for an index descriptor to point a url+sha256 at. This
# package's own release tarball is that artifact.
#
# What is NOT vendored is the point of the exercise: every third-party
# dependency below is an mcpp-index package, so a consumer that also uses
# protobuf or abseil directly links ONE copy, not two.
# ─────────────────────────────────────────────────────────────────────────────

[build]
# The gRPC library TUs, transcribed from upstream CMakeLists.txt (the union of
# add_library(gpr), add_library(grpc), add_library(grpc++) and
# add_library(address_sorting)). Listed here rather than injected by build.mcpp
# so the set is declarative and diffable against upstream — mcpp sees it
# without running a program, and `sources = []` is not a thing: an empty array
# reads as "unset" and falls back to the default src/** glob.
#
# Two entries from upstream's lists are deliberately absent:
#   * src/core/ext/upb-gen/google/protobuf/descriptor.upb_minitable.c —
#     byte-for-byte identical to the bootstrap copy compat.protobuf's `upb`
#     feature compiles; building both is a duplicate-symbol failure.
#   * the 7 c-ares resolver TUs -> [features.ares].sources below.
#
# The *_posix / *_windows variants are listed unconditionally, exactly as
# upstream does: each self-gates on GPR_POSIX_* / GPR_WINDOWS (and
# ADDRESS_SORTING_POSIX / _WINDOWS), compiling to an empty TU elsewhere.
sources = [
    # The lib root: the C++23 module interface. mcpp resolves the lib root
    # of a `kind = "lib"` package as src/<package tail>.cppm, so this file
    # is both the module and what satisfies that convention.
