name: Windows startup diagnosis (temporary)

# TEMPORARY, draft PR only: why does the module test end with "exit 133" on
# Windows? Builds the tests, then runs each test program directly (raw exit
# status), under cdb (stack at the exception) and keeps the programs.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-diag-${{ github.ref }}
  cancel-in-progress: true

env:
  MCPP_VERSION: "2026.11.18.1"
  MCPP_INDEX_MIRROR: GLOBAL

jobs:
  diag:
    runs-on: windows-2025
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: |
            mcpp-2026.11.18.1-windows-x86_64
            target
          key: win-diag-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: win-diag-

      - name: mcpp
        shell: bash
        run: |
          root="$PWD/mcpp-${MCPP_VERSION}-windows-x86_64"
          if [ ! -f "$root/bin/mcpp.exe" ]; then
            archive="mcpp-${MCPP_VERSION}-windows-x86_64.zip"
            curl -L -fsS -o "$archive" "https://github.com/mcpp-community/mcpp/releases/download/v${MCPP_VERSION}/$archive"
            unzip -q "$archive"
          fi
          echo "MCPP=$(cygpath -m "$root/bin/mcpp.exe")" >> "$GITHUB_ENV"
          echo "MCPP_VENDORED_XLINGS=$(cygpath -m "$root/registry/bin/xlings")" >> "$GITHUB_ENV"
          echo "MCPP_ROOT=$(cygpath -m "$root")" >> "$GITHUB_ENV"
          "$root/bin/mcpp.exe" index update

      - name: Link-flag variants (relink only)
        shell: bash
        run: |
          set +e
          "$MCPP" --version
          variant() {
            python3 - "$1" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("mcpp.toml"); s = p.read_text()
          s = re.sub(r'ldflags = \["-lws2_32", "-lcrypt32", "-liphlpapi"[^\]]*\].*',
                     'ldflags = ["-lws2_32", "-lcrypt32", "-liphlpapi"' + sys.argv[1] + ']', s, count=1)
          p.write_text(s)
          PY
            grep -n 'ldflags = \["-lws2_32' mcpp.toml
            "$MCPP" test > "variant-$2.log" 2>&1
            echo "VARIANT $2 ($1): mcpp test rc=$?"
            grep -E '^(module|startup|macros) \.\.\.|test result' "variant-$2.log"
            cp target/x86_64-windows-msvc/*/bin/module.exe "module-$2.exe" 2>/dev/null
            cp target/x86_64-windows-msvc/*/bin/module.pdb "module-$2.pdb" 2>/dev/null
            true
          }
          variant '' A
          variant ', "-Wl,/opt:noref"' D
          variant ', "-g", "-Wl,/opt:ref"' E
          echo "startup=$(cygpath -w "$PWD/module-A.exe")" >> "$GITHUB_ENV"
          echo "module=$(cygpath -w "$PWD/module-E.exe")" >> "$GITHUB_ENV"

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            mcpp-2026.11.18.1-windows-x86_64
            target
          key: win-diag-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run directly (raw exit status)
        if: always()
        shell: pwsh
        env:
          GRPC_VERBOSITY: DEBUG
          GRPC_TRACE: api
        run: |
          foreach ($name in 'startup', 'module') {
            $exe = (Get-Item "env:$name").Value
            Write-Host "== $name : $exe"
            & $exe 2>&1 | Out-Host
            "{0}: exit 0x{1:X8} ({1})" -f $name, $LASTEXITCODE | Out-Host
          }
          exit 0

      - name: Under cdb
        if: always()
        shell: pwsh
        run: |
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) { Write-Host "no cdb"; exit 0 }
          foreach ($name in 'startup', 'module') {
            $exe = (Get-Item "env:$name").Value
            $dir = Split-Path $exe
            Write-Host "== $name under cdb"
            & $cdb -lines -G -y "$dir" -c ".symopt+0x40; .sympath+ D:\a\grpc-m\grpc-m; g; .echo ===EXR===; .exr -1; .echo ===STACK===; kn 100; .echo ===REGS===; r; .echo ===CODE===; ub @rip L12; u @rip L4; q" $exe 2>&1 | Out-Host
          }
          exit 0

      - name: Debug directory of the program
        if: always()
        shell: bash
        run: |
          ro=$(find "$MCPP_ROOT" -iname 'llvm-readobj.exe' | head -1)
          [ -n "$ro" ] && "$ro" --coff-debug-directory "$module" | head -30 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-programs
          path: |
            module-*.exe
            variant-*.log
          if-no-files-found: warn
          retention-days: 5
