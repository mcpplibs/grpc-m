name: Actual project templates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: templates-${{ github.ref }}
  cancel-in-progress: true
env:
  MCPP_VERSION: "2026.11.18.1"
  # See ci.yml: compat.openssl 3.5.9 from mcpp-index#845 until it is published.
  MCPP_INDEX_CANDIDATE: "7359195426993b43217bd07d02454e61c15abf31"
jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.mcpp/registry
          key: template-registry-${{ github.repository }}-${{ env.MCPP_VERSION }}-${{ hashFiles('mcpp.toml') }}
          restore-keys: |
            template-registry-${{ github.repository }}-${{ env.MCPP_VERSION }}-
      - name: Install current mcpp
        shell: bash
        run: |
          archive="mcpp-${MCPP_VERSION}-linux-x86_64.tar.gz"
          curl -L -fsS -o "$archive" "https://github.com/mcpp-community/mcpp/releases/download/v${MCPP_VERSION}/$archive"
          tar -xzf "$archive"
          root="$PWD/mcpp-${MCPP_VERSION}-linux-x86_64"
          mkdir -p "$HOME/.mcpp/registry"
          cp -a "$root/registry/." "$HOME/.mcpp/registry/"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: Install toolchains
        run: |
          mcpp toolchain install gcc 16.1.0
          mcpp toolchain install llvm 23.1.3
      - name: Candidate index (mcpp-index#845)
        run: |
          git init -q "$RUNNER_TEMP/index"
          git -C "$RUNNER_TEMP/index" fetch -q --depth 1 https://github.com/mcpplibs/mcpp-index "$MCPP_INDEX_CANDIDATE"
          git -C "$RUNNER_TEMP/index" checkout -q FETCH_HEAD
      - name: Actual scaffold, strict build and runtime behavior
        run: |
          python3 tools/test_template.py --toolchain llvm@23.1.3 --namespace grpc --index "$RUNNER_TEMP/index"
