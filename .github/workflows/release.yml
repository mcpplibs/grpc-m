name: Release
on:
  push:
    tags: ["mwrap-*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag, upstream version and bilingual entry pages
        run: python3 tools/check_mwrap_release.py --tag "$GITHUB_REF_NAME"
      - name: Require successful source CI at this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion --jq '.[0] | .status == "completed" and .conclusion == "success"')
          test "$result" = true || { echo 'No successful source CI at the tag commit'; exit 1; }
      - name: Build immutable source asset and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#mwrap-}"
          repo="${GITHUB_REPOSITORY#*/}"
          asset="${repo}-${version}.tar.gz"
          git archive --format=tar.gz --prefix="${repo}-${version}/" "$GITHUB_SHA" > "$RUNNER_TEMP/$asset"
          (cd "$RUNNER_TEMP" && sha256sum "$asset" > "$asset.sha256")
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to change immutable assets'; exit 1
          fi
          extra=()
          if [[ "$version" == *-rc* ]]; then extra+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/$asset" "$RUNNER_TEMP/$asset.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$repo $version" \
            --notes "Module wrapper for upstream $version. New mwrap package identities become installable after mcpp-index publication; see the bilingual README for the tested support scope." "${extra[@]}"
