# The canonical gRPC hello-world, as an mcpp project.
#
# Upstream ships this as two binaries you start by hand; here it is one program
# that stands the server up on a loopback port and calls it, so `mcpp run`
# answers "does gRPC actually work" with an exit code.
#
# CODE GENERATION (mcpp 2026.8.5.1+). There is no gen/ directory any more. The
# stubs are generated during the build, by protoc and grpc_cpp_plugin that mcpp
# builds FROM THE SAME PACKAGES this project links against:
#
#   compat.protobuf → protoc            (matches the protobuf runtime)
#   grpc-plugin     → grpc_cpp_plugin   (matches the gRPC being linked)
#
# Both are declared with `tools = [...]`, so a tool's version IS its
# dependency's version — a protoc/runtime mismatch, which is a RUNTIME failure
# and the nastiest thing about hand-managed protobuf codegen, is not
# expressible here. Under `--target` both tools are still built for the build
# machine, because a code generator has to run here.
#
# See ../../.agents/docs/2026-08-05-codegen-ecosystem-design.md.
[package]
name        = "helloworld"
version     = "0.1.0"
standard    = "c++23"
description = "gRPC hello-world: real server + real client + real RPC, in one process"
license     = "Apache-2.0"

[build]
# Only the hand-written source. The generated .pb.cc / .grpc.pb.cc join the
# build as declared outputs of build.mcpp's actions, and the include dir for
# their headers comes from there too — nothing generated is checked in.
sources = ["src/main.cpp"]

[targets.helloworld]
kind = "bin"
main = "src/main.cpp"

[dependencies]
grpc = { path = "../.." }
# The two host tools. `grpc-plugin` is a package separate from `grpc` on
# purpose: a code generator needs a .proto parser and a C++ emitter, not TLS,
# DNS and a regex engine — see the design doc §2.
grpc-plugin     = { path = "../../plugin", tools = ["grpc_cpp_plugin"] }
compat.protobuf = { version = "35.1", tools = ["protoc"] }
