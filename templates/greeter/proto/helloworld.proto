// The canonical gRPC "hello world" service, matching
// https://github.com/grpc/grpc/tree/master/examples/cpp/helloworld
syntax = "proto3";

package helloworld;

service Greeter {
  // Sends a greeting.
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
